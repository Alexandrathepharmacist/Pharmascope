name: Base publique du medicament (mensuel)
on:
  schedule:
    - cron: "17 4 3 * *"   # le 3 de chaque mois
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_bdpm.py
      - .github/workflows/bdpm.yml
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_bdpm.py
      - name: Publier si change
        run: |
          git config user.name "pharmascope-robot"
          git config user.email "pharmascope-robot@users.noreply.github.com"
          git add data/bdpm.json
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Base publique du medicament : mise a jour $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
