function hashSimple(s){var x=0;for(var i=0;i<s.length;i++){x=((x<<5)-x)+s.charCodeAt(i);x=x&x}return Math.abs(x).toString(16)}

/* ===== Dates ===== */
function isoLocal(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function aujIso(){return isoLocal(new Date())}
function plusJours(n){var d=new Date();d.setDate(d.getDate()+n);return isoLocal(d)}
function dateFr(iso){if(!iso)return"";var p=String(iso).split("-");return p.length===3?p[2]+"/"+p[1]:iso}
function joursEntre(a,b){var d1=new Date(a+"T12:00:00"),d2=new Date(b+"T12:00:00");return Math.round((d2-d1)/86400000)}
var JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var MOIS=["janvier","f\u00e9vrier","mars","avril","mai","juin","juillet","ao\u00fbt","septembre","octobre","novembre","d\u00e9cembre"];
function dateLongue(){var d=new Date();var j=JOURS[d.getDay()];return j.charAt(0).toUpperCase()+j.slice(1)+" "+d.getDate()+" "+MOIS[d.getMonth()]}
function heure(d){return("0"+d.getHours()).slice(-2)+"h"+("0"+d.getMinutes()).slice(-2)}

function degz(d){
if(!d)return Promise.resolve(null);
if(!d.gz)return Promise.resolve(d);
var bin=atob(d.gz);var b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
var st=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));
return new Response(st).text().then(function(t){return JSON.parse(t)})}

/* On ne garde des ventes QUE ce qui sert au reassort (quantites vendues
   par produit sur les derniers jours, stock en unites, emplacement).
   Tout le reste (chiffre d'affaires, marges, vendeurs...) est jete aussitot. */
function extraireReassort(v){
if(!v||!v.REC)return null;
var out={REC:{},RECD:(v.RECD||[]).slice().sort(),STKU:{},STKG:{},UPD:v.UPD||""};
Object.keys(v.REC).forEach(function(c){var e=v.REC[c];out.REC[c]={n:e.n,d:e.d};
if(v.STKU&&v.STKU.hasOwnProperty(c))out.STKU[c]=v.STKU[c];
if(v.STKG&&v.STKG[c])out.STKG[c]=v.STKG[c]});
/* Catalogue pour choisir les produits d'une TG ou d'un challenge : nom, code, labo. Aucun montant. */
out.CAT=[];out.LABS=[];
if(v.P)Object.keys(v.P).forEach(function(lab){out.LABS.push(lab);(v.P[lab]||[]).forEach(function(p){if(p&&p.n)out.CAT.push({n:p.n,c:p.c||"",lab:lab,k:normTxt(p.n+" "+lab)})})});
out.LABS.sort();
/* Labo de chaque produit vendu (pour classer le reassort par labo) : on prefere un vrai labo a un grossiste. */
var GROS=["CERP","OCP","COPHAS","COPHASE","PHOENIX","ALLIANCE HEALTHCARE","ASTERA","MOVIANTO","ALLOGA"];
function estGros(s){var u=String(s||"").toUpperCase().trim();return !u||u==="INCONNU"||u==="DIVERS"||GROS.some(function(g){return u===g||u.indexOf(g+" ")===0})}
out.LAB={};
if(v.P)Object.keys(v.P).forEach(function(lab){(v.P[lab]||[]).forEach(function(p){if(p&&p.c&&out.REC[p.c]&&(!out.LAB[p.c]||estGros(out.LAB[p.c])))out.LAB[p.c]=lab})});
if(v.STKV)Object.keys(out.REC).forEach(function(c){var s=v.STKV[c];if(Array.isArray(s)&&s[2]&&(!out.LAB[c]||estGros(out.LAB[c])))out.LAB[c]=s[2]});
Object.keys(out.LAB).forEach(function(c){if(estGros(out.LAB[c]))delete out.LAB[c];else out.LAB[c]=String(out.LAB[c]).replace(/ REF$/,"")});
return out}
function normTxt(s){return String(s||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function chercherProduits(cat,q,max){
var t=normTxt(q).trim();if(t.length<2||!cat)return[];
var mots=t.split(/\s+/);var res=[];
for(var i=0;i<cat.length&&res.length<max;i++){var ok=true;for(var j=0;j<mots.length;j++){if(cat[i].k.indexOf(mots[j])<0){ok=false;break}}if(ok)res.push(cat[i])}
return res}

/* Fusion "a trois" identique a PharmaScope : les modifications faites en meme
   temps sur un autre appareil ne sont jamais ecrasees. */
function jsonEq(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}}
function merge3(base,local,remote){
if(base===undefined||base===null)return local;
if(remote===undefined||remote===null)return local;
function idArr(a){return Array.isArray(a)&&a.every(function(x){return x&&typeof x==="object"&&x.id!==undefined&&x.id!==null})}
if(Array.isArray(base)&&idArr(local)&&idArr(remote)){
var bm={},lm={};base.forEach(function(x){if(x&&x.id!==undefined)bm[x.id]=x});local.forEach(function(x){lm[x.id]=x});
var out=[],vu={};
remote.forEach(function(r){var l=lm[r.id],b=bm[r.id];vu[r.id]=1;
if(l!==undefined){out.push((b===undefined||!jsonEq(l,b))?l:r)}
else{if(b!==undefined&&jsonEq(r,b))return;out.push(r)}});
local.forEach(function(l){if(vu[l.id])return;var b=bm[l.id];if(b!==undefined&&jsonEq(l,b))return;out.push(l)});
return out}
if(base&&local&&remote&&typeof base==="object"&&typeof local==="object"&&typeof remote==="object"&&!Array.isArray(base)&&!Array.isArray(local)&&!Array.isArray(remote)){
var o={},ks={};[base,local,remote].forEach(function(x){Object.keys(x).forEach(function(k){ks[k]=1})});
Object.keys(ks).forEach(function(k){
var inB=base.hasOwnProperty(k),inL=local.hasOwnProperty(k),inR=remote.hasOwnProperty(k);
var lCh=(inL!==inB)||(inL&&!jsonEq(local[k],base[k]));
if(lCh){if(inL)o[k]=local[k]}else{if(inR)o[k]=remote[k]}});
return o}
return local}

function enregistrer(key,val,setter,surErreur){
if(!db){if(surErreur)surErreur();return}
ENVOIS.n++;
db.from("app_data").select("data,updated_at").eq("id",key).maybeSingle().then(function(r){
if(r.error)throw r.error;
var row=r.data;var aSauver=val;
if(row&&row.data!==null&&row.data!==undefined){
var base=SYNC_BASE.hasOwnProperty(key)?SYNC_BASE[key]:(Array.isArray(val)?[]:{});
if(!SYNC_TS[key]||row.updated_at!==SYNC_TS[key]){
if(key==="equipe_reassort_faits"){
var rd=row.data||{};
if(rd.date===val.date){var bc=(base&&base.date===val.date&&base.c)?base.c:{};aSauver={date:val.date,c:merge3(bc,val.c||{},rd.c||{})}}}
else aSauver=merge3(base,val,row.data)}}
var ts=new Date().toISOString();
return db.from("app_data").upsert({id:key,data:aSauver,updated_at:ts}).then(function(r2){
if(r2.error)throw r2.error;
SYNC_BASE[key]=aSauver;SYNC_TS[key]=ts;
if(setter&&!jsonEq(aSauver,val))setter(aSauver)})
}).catch(function(){if(surErreur)surErreur()}).then(function(){ENVOIS.n=Math.max(0,ENVOIS.n-1)})}
