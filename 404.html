<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PharmaScope Planning</title>
<script>
/* Si un lien de connexion (invitation, mot de passe) arrive sur une mauvaise adresse,
   on le renvoie vers la page d'activation en gardant ses informations. */
(function(){
  var h=location.hash||"",q=location.search||"";
  if(/access_token=|error_code=|[#&?]type=(invite|recovery|signup|magiclink)|[?&]code=/.test(h+q)){
    location.replace(location.origin+"/Pharmascope/activation.html"+q+h);
  }
})();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#059669 0%,#0284c7 100%);color:#14232A}
.card{background:#fff;border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:20px;margin:0 0 8px}p{color:#56676D;font-size:15px;margin:0 0 18px}
a{display:block;margin-top:10px;padding:12px;border-radius:10px;background:#059669;color:#fff;text-decoration:none;font-weight:700}
a.alt{background:transparent;color:#059669;border:1px solid #DCE3E5}
</style>
</head>
<body>
<main class="card">
  <h1>Page introuvable</h1>
  <p>Cette adresse n'existe pas sur le site de PharmaScope.</p>
  <a href="/Pharmascope/activation.html">Mon compte PharmaScope Planning</a>
  <a class="alt" href="/Pharmascope/">Ouvrir PharmaScope</a>
</main>
</body>
</html>
