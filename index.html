function parseOspharm(csv,currentLd){
addLog("Format Ospharm detecte - analyse par laboratoires...");
var lines=csv.split(/\r?\n/);
var headerIdx=-1;
for(var h=0;h<Math.min(5,lines.length);h++){
if(lines[h]&&lines[h].toLowerCase().indexOf("libell")>=0){headerIdx=h;break}}
if(headerIdx<0){addLog("ERREUR: en-tete Ospharm non trouvee");return null}
addLog("En-tete: "+lines[headerIdx].substring(0,120));
var hdr=lines[headerIdx].split(";").map(function(c){return c.replace(/"/g,"").trim().toLowerCase()});
var iLib=-1,iQte=-1,iQte1=-1,iCA=-1,iCA1=-1,iM=-1;
hdr.forEach(function(h2,idx){
if(h2.indexOf("libell")>=0&&h2.indexOf("lab")>=0){iLib=idx}
else if(h2.indexOf("ca ht")>=0&&h2.indexOf("n-1")>=0){if(iCA1<0)iCA1=idx}
else if(h2.indexOf("ca ht")>=0){if(iCA<0)iCA=idx}
else if(h2.indexOf("quantit")>=0&&h2.indexOf("n-1")>=0){if(iQte1<0)iQte1=idx}
else if(h2.indexOf("quantit")>=0){if(iQte<0)iQte=idx}
else if(h2.indexOf("marge")>=0&&h2.indexOf("taux")<0&&h2.indexOf("n-1")<0){if(iM<0)iM=idx}});
addLog("Colonnes: Lib="+iLib+" CA HT="+iCA+" CA HT n-1="+iCA1+" Qte="+iQte+" Marge="+iM);
if(iLib<0||iCA<0){addLog("ERREUR: colonnes Libelle ou CA HT non trouvees");return null}
function pn2(v){var s=(v||"").replace(/\s/g,"").replace(",",".");s=s.replace(/[^\d.-]/g,"");return parseFloat(s)||0}
var newLd=Object.assign({},currentLd||{});
var cnt=0;
for(var ri=headerIdx+1;ri<lines.length;ri++){
var ln=lines[ri];if(!ln)continue;
var parts=ln.split(";").map(function(p){return p.replace(/"/g,"").trim()});
if(parts.length<=Math.max(iCA,iLib))continue;
var lab=parts[iLib]||"";if(!lab||lab.length<2)continue;
if(lab.toLowerCase().indexOf("total")>=0)continue;
var ca=pn2(parts[iCA]);
var ca1=iCA1>=0&&iCA1<parts.length?pn2(parts[iCA1]):0;
var marge=iM>=0&&iM<parts.length?pn2(parts[iM]):0;
var qte=iQte>=0&&iQte<parts.length?Math.round(pn2(parts[iQte])):0;
var qte1=iQte1>=0&&iQte1<parts.length?Math.round(pn2(parts[iQte1])):0;
if(ca===0&&ca1===0)continue;
var evol=ca1>0?Math.round((ca-ca1)/ca1*1000)/10:0;
var tx=ca>0?Math.round(marge/ca*1000)/10:0;
var status="stable";
if(evol>20)status="boom";else if(evol>5)status="good";else if(evol<-20)status="danger";else if(evol<-5)status="warning";
var labUp=lab.toUpperCase();var matched=false;
Object.keys(newLd).forEach(function(k){if(!matched&&k.toUpperCase()===labUp){
newLd[k]=Object.assign({},newLd[k],{ca:ca,ca_n1:ca1,marge:marge,qte:qte,qte_n1:qte1,evol_ca:evol,tx:tx,status:status});
matched=true}});
if(!matched){newLd[lab]={ca:ca,ca_n1:ca1,marge:marge,qte:qte,qte_n1:qte1,evol_ca:evol,tx:tx,status:status}}
cnt++}
addLog("Ospharm: "+cnt+" laboratoires importes");
return{newLd:newLd,cnt:cnt}}
