async function decompressGz(b64){
try{
var bin=atob(b64);
var bytes=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
var ds=new DecompressionStream("gzip");
var writer=ds.writable.getWriter();
writer.write(bytes);writer.close();
var reader=ds.readable.getReader();
var chunks=[];var done=false;
while(!done){var r=await reader.read();done=r.done;if(r.value)chunks.push(r.value)}
var total=0;chunks.forEach(function(c){total+=c.length});
var merged=new Uint8Array(total);var off=0;
chunks.forEach(function(c){merged.set(c,off);off+=c.length});
return JSON.parse(new TextDecoder().decode(merged));
}catch(e){console.error("Decompression error:",e);return null}
}

/* ===== EXPORT PDF ===== */
function exportLabPDF(nm,ld,pd){
if(!window.jspdf){
var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
s.onload=function(){exportLabPDF(nm,ld,pd)};document.head.appendChild(s);return}
var d=ld[nm];if(!d)return;
var doc=new window.jspdf.jsPDF();var y=20;var tx=d.ca>0?(d.marge/d.ca*100):0;
doc.setFontSize(18);doc.setTextColor(5,150,105);doc.text("PharmaScope - Fiche Labo",14,y);y+=10;
doc.setFontSize(14);doc.setTextColor(15,23,42);doc.text(nm,14,y);y+=8;
doc.setFontSize(10);doc.setTextColor(100);doc.text("G\u00e9n\u00e9r\u00e9 le "+new Date().toLocaleDateString("fr-FR"),14,y);y+=12;
doc.setFontSize(11);doc.setTextColor(15,23,42);
var lines=[
["CA HT 12 mois",fmtE(d.ca)],["CA HT n-1",fmtE(d.ca_n1)],
["\u00c9volution CA",pct(d.evol_ca)],["Marge HT",fmtE(d.marge)],
["Taux de marque",pct(tx)],["Quantit\u00e9s vendues",String(d.qte||0)],
["Quantit\u00e9s n-1",String(d.qte_n1||0)]
];
lines.forEach(function(l){doc.setFont(undefined,"bold");doc.text(l[0]+":",14,y);
doc.setFont(undefined,"normal");doc.text(l[1],80,y);y+=7});
y+=5;
/* Products if available */
var sups=pd&&pd.MAP&&pd.MAP[nm]?pd.MAP[nm]:[];
var prods=[];sups.forEach(function(s){if(pd.P[s])prods=prods.concat(pd.P[s])});
prods.sort(function(a,b){return(b.ca||0)-(a.ca||0)});
if(prods.length>0){
doc.setFontSize(13);doc.setFont(undefined,"bold");doc.text("Top produits",14,y);y+=8;
doc.setFontSize(9);
prods.slice(0,20).forEach(function(p){
if(y>270){doc.addPage();y=20}
doc.setFont(undefined,"normal");
doc.text((p.n||p.c||"?").substring(0,40),14,y);
doc.text(fmtE(p.ca),120,y);doc.text(pct(p.tx||0),150,y);doc.text(String(p.q||0)+" u.",170,y);y+=5})}

function ImportPage(props){
var msgS=useState("");var msg=msgS[0];var setMsg=msgS[1];
var loadingS=useState(false);var loading=loadingS[0];var setLoading=loadingS[1];

function handleFile(e){
var file=e.target.files[0];
if(!file)return;
setLoading(true);setMsg("Analyse de "+file.name+"...");

var reader=new FileReader();
reader.onload=function(ev){
try{
var name=file.name.toLowerCase();
if(name.endsWith(".xlsx")||name.endsWith(".xls")){
var wb=XLSX.read(ev.target.result,{type:"array"});
var ws=wb.Sheets[wb.SheetNames[0]];
var data=XLSX.utils.sheet_to_json(ws);
setMsg("\u2705 "+file.name+" import\u00e9: "+data.length+" lignes d\u00e9tect\u00e9es dans \u00ab"+wb.SheetNames[0]+"\u00bb");
}else if(name.endsWith(".csv")||name.endsWith(".txt")){
var text=new TextDecoder("iso-8859-1").decode(ev.target.result);
var lines=text.split("\n").filter(function(l){return l.trim()});
setMsg("\u2705 "+file.name+" import\u00e9: "+lines.length+" lignes d\u00e9tect\u00e9es");
}else{
setMsg("\u274c Format non support\u00e9: "+name);
}
}catch(err){
setMsg("\u274c Erreur: "+err.message);
}
setLoading(false);
};
reader.readAsArrayBuffer(file);
}
