Object.keys(fresh.TVA||{}).forEach(function(t){tvaKeys[t]=1});

/* L : union des labos, mois par mois */
out.L={};
var labKeys={};
Object.keys(prev.L||{}).forEach(function(l){labKeys[l]=1});
Object.keys(fresh.L||{}).forEach(function(l){labKeys[l]=1});

return prev.L&&prev.L[lab]?prev.L[lab][fromPrev[m]]||[0,0,0]:[0,0,0]});

/* P : union des produits par EAN, series mensuelles recomposees */

(prev.P&&prev.P[lab]?prev.P[lab]:[]).forEach(function(p){byEan[p.c]={prev:p}});
(fresh.P&&fresh.P[lab]?fresh.P[lab]:[]).forEach(function(p){
if(!byEan[p.c])byEan[p.c]={};byEan[p.c].fresh=p});
var items=[];
Object.keys(byEan).forEach(function(ean){

else{src=pv;ix=fromPrev[m]}
qm.push(src&&src.qm?src.qm[ix]||0:0);

items.sort(function(a,b){return b.ca-a.ca});
if(items.length)out.P[lab]=items});
/* V : union vendeurs, mois par mois */
out.V={};
var vKeys={};
Object.keys(prev.V||{}).forEach(function(v){vKeys[v]=1});
Object.keys(fresh.V||{}).forEach(function(v){vKeys[v]=1});
Object.keys(vKeys).forEach(function(vn){

if(v)md[m]=v});

async function decompressGz(b64){
try{
var bin=atob(b64);
var bytes=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
var ds=new DecompressionStream("gzip");
var writer=ds.writable.getWriter();
writer.write(bytes);writer.close();
var reader=ds.readable.getReader();
var chunks=[];var done=false;
while(!done){var r=await reader.read();done=r.done;if(r.value)chunks.push(r.value)}
var total=0;chunks.forEach(function(c){total+=c.length});
var merged=new Uint8Array(total);var off=0;
chunks.forEach(function(c){merged.set(c,off);off+=c.length});
return JSON.parse(new TextDecoder().decode(merged));
}catch(e){console.error("Decompression error:",e);return null}
}

/* Parse stock CSV */
function parseStock(text){
addLog("Analyse du fichier stock...");
var lines=text.split(/\r?\n/);
var curSup="Divers";var map={};var names={};var supCount=0;
for(var i=0;i<lines.length;i++){
var line=lines[i].trim();
if(!line)continue;
/* Detect supplier line - multiple formats */
var supMatch=line.match(/FOURNISSEUR\s*[:=]\s*(.*)$/i);
if(!supMatch){
var supMatch2=line.replace(/"/g,"").trim();
if(supMatch2.indexOf("FOURNISSEUR")>=0){
curSup=supMatch2.replace(/.*FOURNISSEUR\s*[:=]?\s*/i,"").trim()||"Divers";
if(curSup&&curSup!=="Divers")supCount++;continue}}
else{curSup=supMatch[1].replace(/"/g,"").trim()||"Divers";if(curSup&&curSup!=="Divers")supCount++;continue}
/* Parse product line */
var parts=line.split(";");
if(parts.length>=3){
var code=parts[0].replace(/"/g,"").trim();
var nom=parts[1].replace(/"/g,"").trim();
if(code&&code.length>=5&&/^\d/.test(code)){
map[code]=curSup;names[code]=nom}}}
addLog("Stock: "+Object.keys(map).length+" produits, "+supCount+" fournisseurs");
return{map:map,names:names}}

/* Bornes temporelles : on ignore les dates parasites */

var G2={},TVA2={},FACT={},JOURS={},L2={},P2={},V2={};
var cnt=0,skipped=0,unknownCA=0;
for(var i=headerIdx+1;i<lines.length;i++){

if(tva&&tva!=="0.0"){if(!TVA2[tva])TVA2[tva]={};TVA2[tva][mo]=(TVA2[tva][mo]||0)+ca}

pp.caD[mo]=(pp.caD[mo]||0)+ca;pp.mD[mo]=(pp.mD[mo]||0)+marge;pp.qmD[mo]=(pp.qmD[mo]||0)+Math.round(qte);

if(!V2[vn])V2[vn]={};if(!V2[vn][sup])V2[vn][sup]={};
V2[vn][sup][mo]=(V2[vn][sup][mo]||0)+qte}
cnt++;
if(cnt%20000===0)setProgress(30+Math.round(i/lines.length*50))}
var allMo=Object.keys(G2).sort();
if(!allMo.length||cnt===0){addLog("ERREUR: aucune ligne traitee! Verifiez le format du fichier.");return null}
/* Fenetre glissante: 13 mois jusqu au mois le plus recent du fichier */
var maxMo=allMo[allMo.length-1];
var mp=maxMo.split("-");
var minD=new Date(parseInt(mp[0],10),parseInt(mp[1],10)-1-12,1);
var minMo=minD.getFullYear()+"-"+("0"+(minD.getMonth()+1)).slice(-2);
var months=allMo.filter(function(m){return m>=minMo});
addLog("Lignes traitees: "+cnt.toLocaleString("fr-FR")+" | ignorees: "+skipped);
addLog("Periode retenue: "+months[0]+" -> "+maxMo+" ("+months.length+" mois)");
if(months.length<6)addLog("ATTENTION: export court ("+months.length+" mois). Exportez l edition detaillee sur 12-13 mois glissants pour conserver l historique complet.");

if(Object.keys(md).length)fTVA[t]=md});

Object.keys(L2).forEach(function(sup){
